name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python -m compileall -q .claude/skills/crypto-analyst/scripts
      - name: Unit tests (offline; standard library only)
        run: python -m unittest discover -s .claude/skills/crypto-analyst/tests -v
